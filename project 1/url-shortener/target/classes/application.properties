# ============================================
# APP CONFIG
# ============================================
# Used to build the full short URL returned to clients, e.g. http://localhost:8080/aZ3xQ1
app.base-url=http://localhost:8080

server.port=8080

# ============================================
# DATABASE CONFIG - OPTION 1: H2 (default, zero setup, in-memory)
# ============================================
# Great for learning & local development. Data is wiped every time you restart the app.
spring.datasource.url=jdbc:h2:mem:urlshortener;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Lets you view the database in a browser at http://localhost:8080/h2-console
# JDBC URL to use when logging in: jdbc:h2:mem:urlshortener
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# ============================================
# DATABASE CONFIG - OPTION 2: MySQL (for a real persistent database)
# ============================================
# To use MySQL instead:
#   1. Install MySQL and create a database:  CREATE DATABASE urlshortener;
#   2. Comment out the entire H2 section above
#   3. Uncomment the 4 lines below and set your own username/password
#
# spring.datasource.url=jdbc:mysql://localhost:3306/urlshortener?createDatabaseIfNotExist=true
# spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
# spring.datasource.username=root
# spring.datasource.password=your_mysql_password

# ============================================
# JPA / HIBERNATE CONFIG
# ============================================
# "update" makes Hibernate auto-create/update tables based on our @Entity classes.
# Good for learning; for production you'd normally use migration tools like Flyway/Liquibase instead.
spring.jpa.hibernate.ddl-auto=update

# Prints the SQL Hibernate generates in your console - great for learning what's happening under the hood
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
